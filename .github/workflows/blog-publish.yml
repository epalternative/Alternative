name: Blog · push de borradores a Sanity

# Al mergear a main, cada artículo nuevo o modificado se empuja a Sanity
# como BORRADOR. Publicar sigue siendo un clic humano en el Studio.
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'

# Dos merges seguidos no deben pisarse.
concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesitamos el commit anterior para el diff.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          # @sanity/client exige Node >=22.12; con 20 npm avisa de engine
          # incompatible en cada instalacion.
          node-version: 22
          cache: npm

      # --ignore-scripts omite el postinstall del repo, que ejecuta
      # `prisma generate`. El esquema de Prisma tiene una ruta absoluta de otra
      # maquina (/home/ubuntu/...) que en el runner da EACCES y aborta npm ci.
      # Este workflow no necesita Prisma: solo lee Markdown y escribe en Sanity.
      - run: npm ci --ignore-scripts

      - name: Artículos cambiados en este push
        id: changed
        run: |
          # En el primer push a una rama, github.event.before son ceros; en ese
          # caso se compara contra el padre del commit.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "${{ github.sha }}")
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BEFORE" ${{ github.sha }} \
            -- 'content/posts/*.md' | grep -v '\.en\.md$' || true)
          echo "Artículos: ${FILES:-ninguno}"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Empujar borradores
        if: steps.changed.outputs.files != ''
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          echo "${{ steps.changed.outputs.files }}" | while read -r f; do
            [ -z "$f" ] && continue
            echo "── $f"
            node scripts/sanity-push-post.mjs "$f"
          done
